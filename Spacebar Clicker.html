<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spacebar Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: #ffffff;
            margin-top: 100px;
        }
        #counter {
            font-size: 80px;
            font-weight: bold;
            color: #00ffcc;
            margin: 20px;
        }
        .button {
            background-color: #333;
            color: white;
            border: 2px solid #00ffcc;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            margin: 10px;
        }
        .button:hover {
            background-color: #00ffcc;
            color: #1a1a1a;
        }
        #spacebar-visual {
            display: inline-block;
            background-color: #444;
            border: 3px solid #777;
            padding: 20px 100px;
            font-size: 24px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0px 5px 0px #222;
        }
        #spacebar-visual.active {
            background-color: #00ffcc;
            color: #1a1a1a;
            transform: translateY(4px);
            box-shadow: 0px 1px 0px #222;
        }
    </style>
</head>
<body>

    <h1>Spacebar Clicker</h1>
    <p>Press the <strong>Spacebar</strong> or click the button below!</p>
    
    <div id="counter">0</div>
    
    <button class="button" onclick="incrementScore()">Click Me!</button>
    <br>
    <div id="spacebar-visual">SPACE</div>

    <script>
        let score = 0;
        const counterDisplay = document.getElementById('counter');
        const visualKey = document.getElementById('spacebar-visual');

        function incrementScore() {
            score++;
            counterDisplay.textContent = score;
            
            // Trigger visual press effect
            visualKey.classList.add('active');
            setTimeout(() => {
                visualKey.classList.remove('active');
            }, 100);
        }

        // Listen for spacebar press
        window.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault(); // Prevents page from scrolling down
                incrementScore();
            }
        });
    </script>

</body>
</html>
